<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvati per Servire - Portale Soci</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-heart-pulse-fill me-2"></i>Salvati per Servire
            </a>
            <div id="nav-user-info" class="d-none text-white me-2">
                <span id="user-email-display" class="fw-semibold"></span>
                <button id="btn-logout" class="btn btn-outline-light btn-sm ms-3">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Alert per Messaggi di Feedback -->
        <div id="alert-container"></div>

        <!-- SEZIONE AUTH (Login / Registrazione) -->
        <div id="auth-section" class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-sm-5">

                        <!-- Nav Tabs per passare tra Login e Registrazione -->
                        <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill"
                                    data-bs-target="#login-panel" type="button">Accedi</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill"
                                    data-bs-target="#register-panel" type="button">Registrati</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabContent">
                            <!-- Form Login -->
                            <div class="tab-pane fade show active" id="login-panel">
                                <form id="form-login">
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" id="login-email"
                                            placeholder="nome@esempio.it" required>
                                        <label for="login-email">Email</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control" id="login-password"
                                            placeholder="Password" required>
                                        <label for="login-password">Password</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold">
                                        Accedi <i class="bi bi-arrow-right-short ms-1"></i>
                                    </button>
                                </form>
                            </div>

                            <!-- Form Registrazione (Fase 1) -->
                            <div class="tab-pane fade" id="register-panel">
                                <form id="form-register">
                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="reg-nome" placeholder="Nome"
                                                    required>
                                                <label for="reg-nome">Nome</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="reg-cognome"
                                                    placeholder="Cognome" required>
                                                <label for="reg-cognome">Cognome</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-floating mb-2">
                                        <input type="email" class="form-control" id="reg-email"
                                            placeholder="nome@esempio.it" required>
                                        <label for="reg-email">Email</label>
                                    </div>
                                    <div class="form-floating mb-2">
                                        <input type="password" class="form-control" id="reg-password"
                                            placeholder="Password" required minlength="6">
                                        <label for="reg-password">Password</label>
                                    </div>
                                    <div class="row g-2 mb-3">
                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="reg-citta"
                                                    placeholder="Città">
                                                <label for="reg-citta">Città</label>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="reg-chiesa"
                                                    placeholder="Chiesa">
                                                <label for="reg-chiesa">Chiesa</label>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 py-3 rounded-3 fw-bold">
                                        Crea Account <i class="bi bi-person-plus ms-1"></i>
                                    </button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- SEZIONE PROFILO SOCIO (Fase 2 - Area Riservata) -->
        <div id="profile-section" class="row justify-content-center d-none">
            <div class="col-lg-8">
                <div class="card border-0 shadow-lg rounded-4">
                    <div
                        class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold mb-0 text-primary"><i class="bi bi-person-badge me-2"></i>Profilo Socio ODV
                        </h4>
                        <span id="badge-stato-profilo"
                            class="badge bg-warning text-dark px-3 py-2 rounded-pill">Incompleto</span>
                    </div>
                    <div class="card-body p-4">
                        <form id="form-profile" enctype="multipart/form-data">

                            <div class="row mb-4 align-items-center">
                                <div class="col-md-4 text-center mb-3 mb-md-0">
                                    <div class="position-relative d-inline-block">
                                        <img id="img-preview" src="https://via.placeholder.com/150?text=Foto+Tessera"
                                            class="img-thumbnail rounded-circle shadow-sm"
                                            style="width: 150px; height: 150px; object-fit: cover;">
                                    </div>
                                    <div class="mt-3">
                                        <label for="foto_tessera" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-camera me-1"></i> Carica Foto Tessera
                                        </label>
                                        <input type="file" class="d-none" id="foto_tessera" accept="image/*">
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Nome</label>
                                            <input type="text" class="form-control" id="prof-nome">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Cognome</label>
                                            <input type="text" class="form-control" id="prof-cognome">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Codice Fiscale</label>
                                            <input type="text" class="form-control" id="prof-cf"
                                                placeholder="es. ABCDEF12G34H567I" maxlength="16">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Telefono</label>
                                            <input type="tel" class="form-control" id="prof-telefono">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Città</label>
                                            <input type="text" class="form-control" id="prof-citta">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label text-muted small fw-bold">Chiesa di
                                                appartenenza</label>
                                            <input type="text" class="form-control" id="prof-chiesa">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary px-4 py-2 rounded-3 fw-bold">
                                    <i class="bi bi-save me-1"></i> Salva e Completa Profilo
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
